<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Kies je racer</title>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Nunito+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E3B78}a:hover{color:#1E2A36}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF2E2; font-family: 'Nunito Sans', sans-serif; color: #1E2A36; display: flex; flex-direction: column;">
  <header style="position: relative; padding: 20px 16px 14px; text-align: center;">
    <a href="Main.dc.html" aria-label="Terug" style="position: absolute; left: 10px; top: 18px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1E2A36;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 32px; line-height: 1.2;">Kies je racer</h1>
  </header>

  <main style="flex: 1; padding: 0 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: 116px; gap: 10px; align-content: start;">
    <sc-for list="{{racers}}" as="r" hint-placeholder-count="9">
      <button onClick="{{r.pick}}" aria-pressed="{{r.pressed}}" style="{{r.tileStyle}}">
        <img src="{{r.img}}" alt="" style="width: 92px; height: 82px; object-fit: contain;">
        <span style="font-family: 'Nunito Sans', sans-serif; font-size: 14px; font-weight: 800; color: #1E2A36;">{{r.name}}</span>
      </button>
    </sc-for>
  </main>

  <div style="padding: 10px 16px 30px; display: flex; flex-direction: column; gap: 10px;">
    <div style="text-align: center; font-size: 14px; color: #3E4752;">{{tagline}}</div>
    <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; background: linear-gradient(180deg, #4FB255, #2E7D32); color: #FFFFFF; border-radius: 999px; height: 60px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: 0.04em; box-shadow: 0 4px 0 #1F5E24, 0 10px 18px rgba(46,125,50,0.25);">KIES DEZE RACER
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var picked = (this.state && this.state.picked) || 'slak';
var list = [
{ id: 'slak', name: 'Slak', img: '../../../public/images/racers/gerard.webp', line: 'Slak. Langzaam, maar met overtuiging.' },
{ id: 'schildpad', name: 'Schildpad', img: '../../../public/images/racers/schildpad.webp', line: 'Schildpad. Laat zich door niets afleiden.' },
{ id: 'eend', name: 'Eend', img: '../../../public/images/racers/eend.webp', line: 'Eend. Snel, maar weet zelden waarheen.' },
{ id: 'rups', name: 'Rups', img: '../../../public/images/racers/rups.webp', line: 'Rups. Slaapt vooral.' },
{ id: 'mier', name: 'Mier', img: '../../../public/images/racers/mier.webp', line: 'Mier. Draagt onderweg dingen die niet van hem zijn.' },
{ id: 'aardappel', name: 'Aardappel', img: '../../../public/images/racers/aardappel.webp', line: 'Aardappel. Niemand weet hoe hij beweegt.' },
{ id: 'knuffel', name: 'Knuffel', img: '../../../public/images/racers/knuffel.webp', line: 'Knuffel. Wordt overal geknuffeld. Dat kost tijd.' },
{ id: 'steen', name: 'Steen', img: '../../../public/images/racers/steen.webp', line: 'Steen. Still going.' },
{ id: 'stofzuiger', name: 'Stofzuiger', img: '../../../public/images/racers/stofzuiger.webp', line: 'Stofzuiger. Moet steeds terug naar het stopcontact.' }
];
var line = '';
var racers = list.map(function (r) {
var on = r.id === picked;
if (on) { line = r.line; }
return {
name: r.name, img: r.img, pressed: on ? 'true' : 'false',
pick: function () { self.setState({ picked: r.id }); },
tileStyle: 'display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px; border-radius: 16px; cursor: pointer; box-shadow: 0 2px 8px rgba(30,42,54,0.06); ' +
(on ? 'background: #EAF3FC; border: 3px solid #2B79D0;' : 'background: #F3EAD8; border: 3px solid transparent;')
};
});
return { racers: racers, tagline: line };
}
}
</script>
</body>
</html>
