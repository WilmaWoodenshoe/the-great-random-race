<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Accessoires</title>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Nunito+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E3B78}a:hover{color:#1E2A36}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF2E2; font-family: 'Nunito Sans', sans-serif; color: #1E2A36; display: flex; flex-direction: column;">
  <header style="padding: 20px 14px 12px; display: flex; flex-direction: column; gap: 14px;">
    <h1 style="margin: 0; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 32px;">
      <svg width="34" height="26" viewBox="0 0 34 26" aria-hidden="true"><ellipse cx="17" cy="20" rx="16" ry="4" fill="#1E2A36"></ellipse><path d="M8 20 C8 6 26 6 26 20 Z" fill="#2A3440"></path><rect x="8" y="15" width="18" height="3" fill="#8A5A2B"></rect></svg>Accessoires</h1>
    <div role="tablist" aria-label="Soort accessoire" style="display: flex; gap: 6px; justify-content: space-between;">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
        <button role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>
  </header>

  <main style="flex: 1; padding: 0 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: 110px; gap: 10px; align-content: start;">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="9">
      <button onClick="{{it.pick}}" aria-pressed="{{it.pressed}}" style="{{it.tileStyle}}">
        <img src="{{it.img}}" alt="" style="width: 84px; height: 70px; object-fit: contain;">
        <span style="font-family: 'Nunito Sans', sans-serif; font-size: 14px; font-weight: 800; color: #1E2A36;">{{it.name}}</span>
      </button>
    </sc-for>
  </main>

  <div style="padding: 8px 16px 6px; text-align: center; font-size: 14px; color: #3E4752;">{{tagline}}</div>

  <nav aria-label="Hoofdmenu" style="margin-top: 8px; background: #FBF2E2; border-top: 1px solid #EADFC8; padding: 10px 6px 22px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #6B7280; font-size: 12px; font-weight: 700;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"></path><path d="M5 10v10h14V10"></path></svg>Home</a>
    <a href="Race.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #6B7280; font-size: 12px; font-weight: 700;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"></path><path d="M5 4h12l-2 4 2 4H5"></path></svg>Race</a>
    <a href="Racer.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #6B7280; font-size: 12px; font-weight: 700;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="15" r="4"></circle><circle cx="5.5" cy="10" r="2"></circle><circle cx="9.5" cy="5.5" r="2"></circle><circle cx="14.5" cy="5.5" r="2"></circle><circle cx="18.5" cy="10" r="2"></circle></svg>Gerard</a>
    <a href="Accessoires.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #0E3B78; font-size: 12px; font-weight: 800;"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M9 3v4M15 3v4"></path><circle cx="12" cy="13" r="3" fill="#FBF2E2"></circle></svg>Collectie</a>
    <a href="Leaderboard.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #6B7280; font-size: 12px; font-weight: 700;"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>Meer</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var st = this.state || {};
var tab = st.tab || 'Hoeden';
var picked = st.picked || 'kroon';
var tabs = ['Alle', 'Hoeden', 'Ogen', 'Rugzakken', 'Speciaal'].map(function (l) {
var on = l === tab;
return {
label: l, selected: on ? 'true' : 'false',
pick: function () { self.setState({ tab: l }); },
style: 'border: 1px solid ' + (on ? '#0E3B78' : '#E2D6BE') + '; border-radius: 999px; padding: 8px 11px; font-family: inherit; font-size: 13px; font-weight: ' + (on ? '800' : '700') + '; background: ' + (on ? '#0E3B78' : '#FFFFFF') + '; color: ' + (on ? '#FFFFFF' : '#3E4752') + '; cursor: pointer;'
};
});
var list = [
{ id: 'geen', name: 'Geen hoed', img: '../../../public/images/accessories/geen.png', line: 'Gerard zoals de natuur hem bedoeld heeft.' },
{ id: 'pet', name: 'Pet', img: '../../../public/images/accessories/pet.png', line: 'Sportief. Maakt hem niet sneller.' },
{ id: 'zonnebril', name: 'Zonnebril', img: '../../../public/images/accessories/zonnebril.png', line: 'Op twee voelsprieten. Knap werk.' },
{ id: 'hoed', name: 'Hoed', img: '../../../public/images/accessories/hoed.png', line: 'Een heer op weg naar de finish.' },
{ id: 'kroon', name: 'Kroon', img: '../../../public/images/accessories/kroon.png', line: 'Gerard draagt hem al. Niemand heeft gevraagd waarom.' },
{ id: 'feesthoed', name: 'Feesthoed', img: '../../../public/images/accessories/feesthoed.png', line: 'Voor als hij ooit wint.' },
{ id: 'helm', name: 'Helm', img: '../../../public/images/accessories/helm.png', line: 'Veiligheid voorop, bij 0,003 km per uur.' },
{ id: 'sjaal', name: 'Sjaal', img: '../../../public/images/accessories/sjaal.png', line: 'Voor koude ochtenden op de Heuvel.' },
{ id: 'boerenhoed', name: 'Boerenhoed', img: '../../../public/images/accessories/boerenhoed.png', line: 'Tegen de zon in het Bloemenveld.' }
];
var line = '';
var items = list.map(function (a) {
var on = a.id === picked;
if (on) { line = a.line; }
return {
name: a.name, img: a.img, pressed: on ? 'true' : 'false',
pick: function () { self.setState({ picked: a.id }); },
tileStyle: 'display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px; border-radius: 16px; cursor: pointer; box-shadow: 0 2px 8px rgba(30,42,54,0.06); ' +
(on ? 'background: #EAF3FC; border: 3px solid #2B79D0;' : 'background: #F3EAD8; border: 3px solid transparent;')
};
});
return { tabs: tabs, items: items, tagline: line };
}
}
</script>
</body>
</html>
