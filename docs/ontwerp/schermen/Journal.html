<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Journaal</title>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Nunito+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E3B78}a:hover{color:#1E2A36}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF2E2; font-family: 'Nunito Sans', sans-serif; color: #1E2A36; display: flex; flex-direction: column;">
  <header style="position: relative; padding: 20px 16px 10px; display: flex; flex-direction: column; gap: 12px;">
    <a href="Main.dc.html" aria-label="Terug" style="position: absolute; left: 10px; top: 18px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1E2A36;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.2;">
      <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5c3-1 6-1 9 1v14c-3-2-6-2-9-1z" fill="#2E8AD8" stroke="#1E2A36" stroke-width="1.4" stroke-linejoin="round"></path><path d="M21 5c-3-1-6-1-9 1v14c3-2 6-2 9-1z" fill="#4FA2EA" stroke="#1E2A36" stroke-width="1.4" stroke-linejoin="round"></path></svg>Gerards journaal</h1>
    <div style="display: flex; justify-content: flex-end;">
      <button aria-label="Kies een race" style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 14px; border-radius: 12px; border: 1px solid #E2D6BE; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #1E2A36;">Race #284
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
    </div>
  </header>

  <main style="flex: 1; padding: 4px 18px 0; position: relative;">
    <div style="position: absolute; left: 25px; top: 18px; bottom: 30px; width: 2px; background: #E2D6BE;"></div>
    <sc-for list="{{entries}}" as="e" hint-placeholder-count="11">
      <div style="position: relative; display: flex; align-items: center; gap: 12px; padding: 7px 0; border-bottom: 1px solid #EFE6D4;">
        <div style="{{e.dot}}"></div>
        <div style="width: 40px; font-size: 13px; font-weight: 700; color: #3E4752;">{{e.time}}</div>
        <img src="{{e.icon}}" alt="" style="width: 24px; height: 24px;">
        <div style="flex: 1; font-size: 15px;">{{e.text}}</div>
      </div>
    </sc-for>
  </main>
  <div style="height: 24px;"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var C = { g: '#3FA34D', o: '#F06A2A', p: '#7B4FC4', y: '#9AA1A8' };
var row = function (time, c, icon, text) {
return { time: time, text: text, icon: icon, dot: 'width: 12px; height: 12px; border-radius: 999px; flex-shrink: 0; background: ' + C[c] + '; box-shadow: 0 0 0 3px #FBF2E2; margin-left: 2px;' };
};
return {
entries: [
row('08:31', 'g', '../../../public/images/journal/j00.png', 'Vertrokken.'),
row('09:14', 'o', '../../../public/images/journal/j01.png', 'Bloem gevonden.'),
row('09:17', 'p', '../../../public/images/journal/j02.png', 'Bloem bekeken.'),
row('09:48', 'o', '../../../public/images/journal/j03.png', 'Nog steeds bloem bekeken.'),
row('10:02', 'g', '../../../public/images/journal/j04.png', 'Verder gegaan.'),
row('11:43', 'o', '../../../public/images/journal/j05.png', 'Gestopt voor onbekende reden.'),
row('13:20', 'g', '../../../public/images/journal/j06.png', 'Sla gegeten.'),
row('13:21', 'y', '../../../public/images/journal/j07.png', 'Slaap.'),
row('15:02', 'o', '../../../public/images/journal/j08.png', 'Werd afgeleid door een vogel.'),
row('15:18', 'g', '../../../public/images/journal/j09.png', 'Verder gegaan.'),
row('16:44', 'o', '../../../public/images/journal/j10.png', 'Aangekomen bij het modderveld.')
]
};
}
}
</script>
</body>
</html>
