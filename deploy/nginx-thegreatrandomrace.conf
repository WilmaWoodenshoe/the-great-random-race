# nginx-instelling voor thegreatrandomrace.nl
# Komt op de server in /etc/nginx/sites-available/thegreatrandomrace
# HTTPS (poort 443) voegt certbot er daarna zelf aan toe.

server {
    listen 80;
    listen [::]:80;
    server_name thegreatrandomrace.nl www.thegreatrandomrace.nl;

    root /var/www/thegreatrandomrace;
    index index.html;

    # Geen bezoekerslogboek: de app verzamelt niets (zie /privacy).
    access_log off;

    # De map is een kopie van de tak 'productie'; de git-gegevens zijn geheim.
    location ~ /\.git {
        deny all;
        return 404;
    }

    # De app zelf en de 'service worker' altijd vers ophalen,
    # zodat spelers na een update meteen de nieuwe versie krijgen.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { application/manifest+json webmanifest; }
    }

    # Bestanden met een code in de naam veranderen nooit: lang bewaren.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
}
